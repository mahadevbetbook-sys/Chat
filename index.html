<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mahadev Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#e5ddd5;
}

/* HEADER */
.header{
  background:#075e54;
  color:#fff;
  padding:10px;
  display:flex;
  align-items:center;
}
.dp{
  width:42px;
  height:42px;
  border-radius:50%;
  margin-right:10px;
  object-fit:cover;
}
.user-info{
  line-height:1.2;
}
.name{
  font-size:16px;
  font-weight:500;
  display:flex;
  align-items:center;
}
.tick{
  width:16px;
  height:16px;
  margin-left:4px;
}
.status{
  font-size:12px;
  opacity:0.9;
}

/* CHAT AREA */
.chat-area{
  height:calc(100vh - 120px);
  background:#ece5dd;
}

/* INPUT BAR */
.footer{
  position:fixed;
  bottom:0;
  width:100%;
  background:#f0f0f0;
  padding:8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.icon{
  font-size:22px;
  color:#666;
}

/* TEXT BOX */
.footer textarea{
  flex:1;
  resize:none;
  border:none;
  border-radius:20px;
  padding:10px 14px;
  font-size:16px;
  outline:none;
  max-height:120px;
  caret-color:#25D366;
}

/* SEND BUTTON */
.send{
  background:#25d366;
  border:none;
  width:42px;
  height:42px;
  border-radius:50%;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <!-- DP (local file: dp.jpg) -->
  <img src="dp.jpg" class="dp">

  <div class="user-info">
    <div class="name">
      Mahadev Support
      <!-- BLUE TICK (external, no upload needed) -->
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/e/e4/Twitter_Verified_Badge.svg"
        class="tick"
        alt="verified"
      >
    </div>
    <div class="status">online</div>
  </div>
</div>

<div class="chat-area"></div>

<!-- INPUT -->
<div class="footer">
  <span class="icon">😊</span>
  <span class="icon">📎</span>

  <textarea id="msgBox" rows="1"></textarea>

  <button class="send" onclick="sendMsg()">➤</button>
</div>

<script>
const box = document.getElementById("msgBox");

/* DEFAULT AUTO TEXT */
box.value = "Sir need Mahadev original I'd in 100rs";

/* AUTO KEYBOARD OPEN */
setTimeout(()=>{ box.focus(); },300);

/* AUTO HEIGHT */
box.addEventListener("input",()=>{
  box.style.height="auto";
  box.style.height=box.scrollHeight+"px";
});

/* SEND TO WHATSAPP */
function sendMsg(){
  let msg = box.value.trim();
  if(!msg) return;

  let phone = "91XXXXXXXXXX"; // 👈 अपना WhatsApp number
  let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);
  window.location.href = url;
}
</script>

</body>
</html>
