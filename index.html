<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>

    background:#0f172a;

/* Header */
.header{
    display:flex;
    align-items:center;

.dp-box{

/* Blue Tick */
.tick{
    position:absolute;
    bottom:-3px;
    right:-3px;
    width:18px;
    height:18px;
    background:#1d4ed8;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    color:white;
}

/* Name */
.name{
    font-size:18px;
    font-weight:600;
}

/* Button */
.btn{
    margin:25px;
    display:block;
    text-align:center;
    background:#22c55e;
    color:#000;
    padding:14px;
    border-radius:10px;
    text-decoration:none;
    font-size:16px;
    font-weight:bold;
}
</style>
</head>

<!-- HEADER -->
<div class="header">
    <div class="dp-box">
