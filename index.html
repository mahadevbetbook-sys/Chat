<style>
*{ box-sizing:border-box; }
body{
  margin:0;
  font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:#e5ddd5;
}
.header{
  background:#075e54;
  color:#fff;
  padding:10px;
  display:flex;
  align-items:center;
}
.dp{
  width:42px;
  height:42px;
  border-radius:50%;
  margin-right:10px;
  object-fit:cover;
}
.name{
  font-size:16px;
  font-weight:500;
  display:flex;
  align-items:center;
}
.tick{
  width:16px;
  height:16px;
  margin-left:5px;
}
.status{
  font-size:12px;
  opacity:0.9;
}
.chat-area{
  height:calc(100vh - 120px);
  background:#ece5dd;
}
.footer{
  position:fixed;
  bottom:0;
  width:100%;
  background:#f0f0f0;
  padding:8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.icon{ font-size:22px; }
.footer textarea{
  flex:1;
  resize:none;
  border:none;
  border-radius:20px;
  padding:10px 14px;
  font-size:16px;
  outline:none;
}
.send{
  background:#25d366;
  border:none;
  width:42px;
  height:42px;
  border-radius:50%;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <img src="./mahadev.png" class="dp">
  <div>
    <div class="name">
      Mahadev Official
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e4/Twitter_Verified_Badge.svg" class="tick">
    </div>
    <div class="status">online</div>
  </div>
</div>

<div class="chat-area"></div>

<div class="footer">
  <span class="icon">😊</span>
  <span class="icon">📎</span>
  <textarea id="msgBox" rows="1"></textarea>
  <button class="send" onclick="sendMsg()">➤</button>
</div>

<script>
const box = document.getElementById("msgBox");
box.value = "Sir need Mahadev original I'd in 100rs";
setTimeout(()=>box.focus(),300);

box.addEventListener("input",()=>{
  box.style.height="auto";
  box.style.height=box.scrollHeight+"px";
});

function sendMsg(){
  let msg = box.value.trim();
  if(!msg) return;

  // 🔥 Meta Event on WhatsApp Click
  fbq('track', 'Lead');

  let phone = "233200656166";
  window.location.href =
    "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);
}
</script>

</body>
</html>
