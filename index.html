<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mahadev Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background:#e5ddd5;
}

/* HEADER */
.header{
  background:#075e54;
  color:#fff;
  padding:12px;
  display:flex;
  align-items:center;
}
.header img{width:32px;margin-right:10px}
.header .title{font-size:16px;line-height:1.2}

/* CHAT AREA */
.chat-area{
  height:calc(100vh - 120px);
  background:#ece5dd;
}

/* INPUT BAR */
.footer{
  position:fixed;
  bottom:0;
  width:100%;
  background:#f0f0f0;
  padding:8px;
  display:flex;
  align-items:center;
  gap:8px;
}

/* ICONS */
.icon{
  font-size:22px;
  color:#666;
  cursor:pointer;
}

/* TEXT BOX */
.footer textarea{
  flex:1;
  resize:none;
  border:none;
  border-radius:20px;
  padding:10px 14px;
  font-size:16px;
  outline:none;
  max-height:120px;
}

/* SEND BUTTON */
.send{
  background:#25d366;
  border:none;
  width:42px;
  height:42px;
  border-radius:50%;
  color:#fff;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
  <div class="title">
    Mahadev Support<br>
    <small>online</small>
  </div>
</div>

<div class="chat-area"></div>

<div class="footer">
  <span class="icon">😊</span>
  <span class="icon">📎</span>

  <textarea id="msgBox" rows="1"></textarea>

  <button class="send" onclick="sendMsg()">➤</button>
</div>

<script>
const box = document.getElementById("msgBox");

// DEFAULT MESSAGE
box.value = "Sir need Mahadev original I'd in 100rs";

// AUTO FOCUS (keyboard open)
setTimeout(()=>{ box.focus(); },300);

// AUTO HEIGHT
box.addEventListener("input",()=>{
  box.style.height="auto";
  box.style.height=box.scrollHeight+"px";
});

function sendMsg(){
  let msg = box.value.trim();
  if(!msg) return;

  let phone = "91XXXXXXXXXX"; // 👉 apna number
  let url = "https://wa.me/"+phone+"?text="+encodeURIComponent(msg);
  window.location.href = url;
}
</script>

</body>
</html>
