<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chat Support</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#e5ddd5;
}
.header{
  background:#075e54;
  color:#fff;
  padding:12px;
  display:flex;
  align-items:center;
}
.header img{
  width:32px;
  margin-right:10px;
}
.header .title{
  font-size:16px;
}
.chat-area{
  padding:15px;
  height:60vh;
  background:#ece5dd;
}
.footer{
  position:fixed;
  bottom:0;
  width:100%;
  background:#f0f0f0;
  padding:10px;
  display:flex;
}
.footer textarea{
  flex:1;
  resize:none;
  border:none;
  border-radius:20px;
  padding:12px;
  font-size:15px;
  outline:none;
}
.footer button{
  background:#25d366;
  border:none;
  color:#fff;
  width:50px;
  margin-left:8px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="header">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg">
  <div class="title">
    Mahadev Support<br>
    <small>online</small>
  </div>
</div>

<div class="chat-area">
  <!-- empty just like WhatsApp -->
</div>

<div class="footer">
  <textarea id="msgBox" rows="1"></textarea>
  <button onclick="sendMsg()">➤</button>
</div>

<script>
// 👉 DEFAULT MESSAGE (ads se aane par auto)
let defaultMsg = "Sir need Mahadev original I'd in 100rs";

// page load par auto text
document.getElementById("msgBox").value = defaultMsg;

function sendMsg(){
  let msg = document.getElementById("msgBox").value;
  if(msg.trim() === "") return;

  let phone = "919955414283"; // 👉 apna WhatsApp number yaha daalo
  let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(msg);
  window.location.href = url;
}
</script>

</body>
</html>
